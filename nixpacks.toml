[phases.setup]
aptPkgs = ["curl", "ca-certificates"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "curl -fsSL https://deb.nodesource.com/setup_22.x | bash -",
  "apt-get install -y nodejs",
  "npm ci"
]
cacheDirectories = ["/root/.npm"]

[phases.build]
dependsOn = ["install"]
cmds = [
  "rm -rf node_modules/.cache || true",
  "npm run build",
  "npm prune --omit=dev"
]
cacheDirectories = []

[start]
cmd = "npx --yes serve@14.2.4 dist -s -l 3000"
